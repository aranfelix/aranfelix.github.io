project:
  type: website
  output-dir: docs
  resources:
    - files/*

website:
  title: "Aran Felix"
  site-url: https://aranfelix.github.io
  description: "Aran Felix, The Data Cruncher: statistics, data analytics and research & M&E portfolio."
  favicon: images/favicon.svg
  open-graph: true
  twitter-card: true
  search: true
  back-to-top-navigation: true
  navbar:
    logo: images/logo.png
    logo-alt: "Aran Felix, The Data Cruncher"
    title: false
    background: "#10243A"
    foreground: "#FFFFFF"
    collapse-below: lg
    right:
      - text: "Home"
        href: index.qmd
      - text: "Projects"
        href: projects.qmd
      - text: "Research & M&E"
        href: research-m-e.qmd
      - text: "About"
        href: about.qmd
      - text: "Contact"
        menu:
          - text: "WhatsApp"
            icon: whatsapp
            href: "https://wa.me/254111991749"
          - text: "LinkedIn"
            icon: linkedin
            href: "https://www.linkedin.com/in/aranfelix/"
          - text: "Email"
            icon: envelope
            href: "mailto:aranfelix2013@gmail.com"
          - text: "GitHub"
            icon: github
            href: "https://github.com/aranfelix"
  page-footer:
    left: "&copy; 2026 Aran Felix &middot; The Data Cruncher"
    right: "Built with Quarto"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    respect-user-color-scheme: true
    css:
      - styles.css
      - tools.css
    lang: en-GB
    grid:
      sidebar-width: 0px
      body-width: 1060px
      margin-width: 0px
      gutter-width: 1.5rem
    toc: false
    anchor-sections: false
    smooth-scroll: true
    link-external-newwindow: true
    code-fold: true
    code-tools: false
    fig-align: center

execute:
  freeze: auto
  warning: false
  message: false
